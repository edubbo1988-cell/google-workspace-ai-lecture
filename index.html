const DATA={"slides":[{"title":"Google Workspace와 생성형 AI를 활용한 데이터 수집·분석·시각화","kicker":"INTRO","kind":"hero","points":["설문을 만들고 → 데이터를 분석하고 → 웹 대시보드로 전달합니다.","교육 대상 · 40~60대 예비 강사"],"steps":[],"codes":[],"note":"오늘의 목표는 코드를 외우는 것이 아니라 AI에게 필요한 결과를 정확히 요청하고 검증하는 것입니다."},{"title":"강사에게 데이터 활용이 필요한 이유","kicker":"INTRO","kind":"cards","points":["교육 만족도 확인","학습 지원이 필요한 부분 발견","기관에 성과를 명확하게 보고"],"steps":[],"codes":[],"note":"막연한 느낌이 아니라 응답 데이터에 근거해 교육을 개선하는 과정을 소개합니다."},{"title":"오늘의 실습 로드맵","kicker":"INTRO","kind":"roadmap","points":["STEP 1 · Google Forms 설문","STEP 2 · Sheets 가상 데이터","STEP 3 · 수식·피벗·Gemini 분석","STEP 4 · 바이브 코딩 웹 대시보드"],"steps":[],"codes":[],"note":"전체 과정은 네 단계입니다. 각 단계에서 결과물을 확인하고 다음 단계로 이동합니다."},{"title":"STEP 1 — 교육 만족도 설문지 만들기","kicker":"STEP 1","kind":"section","points":["AI로 문항 설계 → Google Forms 제작 → 응답 시트 연결"],"steps":["설문 목적과 대상 정하기","AI에 설문 문항 생성 요청","Google Forms에 질문 입력","응답 탭에서 Sheets 연결"],"codes":[],"note":"설문은 수집할 데이터의 구조를 결정합니다."},{"title":"실습에 사용할 교육 사례","kicker":"STEP 1","kind":"case","points":["과정명 · AI와 함께하는 디지털 첫걸음 (디지털 역량 UP!)","대상 · 고등학생 발달장애인 7명","기간 · 6일 / 12차시","AI 안전 → 디자인 → 캐릭터 → 스티커 → 생활 디지털 → 새해 카드"],"steps":[],"codes":[],"note":"실제 학생 정보가 아닌 교육 실습을 위한 가상 사례입니다."},{"title":"교육 만족도 설문 문항 구성","kicker":"STEP 1","kind":"survey","points":["섹션 1 · 개인정보 동의 / 이름 / 연락처 / 응답자 구분","섹션 2 · 즐거움 / 이해도 / 속도 / 활동 / 자신감 / 결과물 / 재참여 / NPS / 의견"],"steps":["섹션을 2개로 분리","객관식·척도·체크박스·장문형 질문 사용","분석에 사용할 질문 번호와 응답 선택지 확인"],"codes":[],"note":"원본 PDF에는 10~12개 문항 요청과 더 많은 표준 항목이 함께 제시됩니다. 실제 질문 개수는 최종 확정이 필요합니다."},{"title":"실습 1 — AI로 설문 문항 생성하기","kicker":"STEP 1","kind":"prompt","points":["교육 개요와 요구조건을 AI에게 전달","응답 대상에 맞는 쉬운 표현 사용","질문 유형과 보기를 함께 요청"],"steps":["프롬프트 복사","ChatGPT 또는 Gemini에 붙여넣기","질문 수·척도·응답 선택지 검토"],"codes":[["설문지 문항 생성 프롬프트","너는 교육 평가 전문가야. 아래 교육 개요를 바탕으로 구글 폼용 만족도 설문 문항(10~12개)을 만들어줘.\n\n[교육 개요]\n- 과정명: AI와 함께하는 디지털 첫걸음 (디지털 역량 UP!)\n- 대상: 고등학생 발달장애인 7명 (협력강사 동반 가능)\n- 기간: 총 6일, 12차시\n- 커리큘럼: AI 안전 → 디자인 체험 → 캐릭터 제작 → 스티커 완성 → 생활 디지털 → 새해 카드\n\n[요구조건]\n1. 구글 폼 섹션 2개로 분리:\n   - 섹션 1: 개인정보 수집 동의, 성함, 연락처, 응답자 구분(본인/동반/대리)\n   - 섹션 2: 교육 만족도 본 설문 (난이도, 재미, 자신감, 결과물 만족, 추천 지수 등)\n2. 발달장애인 눈높이에 맞춘 쉬운 어휘와 척도(1~5점, 이모지) 사용\n3. 스프레드시트 분석을 위해 모든 질문 앞에 번호(1., 2. 등) 반드시 표기\n4. 문항별 [질문 형태]와 [보기] 명시"]],"note":"생성된 질문은 반드시 강사가 읽고 표현과 응답 방식을 점검합니다."},{"title":"Google Forms에서 설문지 만들기","kicker":"STEP 1","kind":"form","points":["확정된 문항을 바탕으로 Google Forms 제작용 결과물 2가지를 AI에 요청합니다.","파트 1 · Forms 내장 AI 입력용 프롬프트","파트 2 · Apps Script 자동 생성 코드"],"steps":["앞 슬라이드에서 설문 문항을 생성하고 질문 번호·섹션·선택지를 최종 확정합니다.","확정된 설문 문항이 있는 같은 AI 대화에서 아래 요청 프롬프트를 복사하여 입력합니다.","AI가 출력한 파트 1(Forms 내장 AI용 프롬프트)과 파트 2(Apps Script 코드)를 각각 확인합니다.","방법 A: 파트 1을 Google Forms 내장 AI에 입력하여 설문지를 생성합니다(기능 제공 계정).","방법 B: 파트 2 코드를 Google Sheets → 확장 프로그램 → Apps Script에 붙여넣고 저장·실행합니다.","섹션 1·2, 질문 일련번호, 질문 유형, 선택지, 필수 여부를 미리보기로 검증합니다."],"codes":[["확정 문항 기반 구글 폼 생성 프롬프트","위 확정된 설문 문항으로 구글 설문지로 구현할 수 있도록 2가지 형태의 결과물을 작성해줘.\n질문 제목의 일련번호(1., 2. 등)가 절대 누락되지 않도록 주의하여 아래 두 파트로 출력해줘.\n\n■ 파트 1: 구글 폼 내장 AI(Help me create a form) 입력용 프롬프트\n- 섹션 구분(섹션 1, 섹션 2)과 질문 번호가 그대로 반영되도록 정돈된 텍스트.\n\n■ 파트 2: Google Apps Script 원클릭 자동 생성 코드\n- 구글 스프레드시트의 Apps Script에 붙여넣고 [실행]을 누르면\n섹션 나누기(addPageBreakItem)와 각 문항(객관식, 척도, 체크박스 등)이 완벽히 세팅되는 단독 실행 JavaScript 코드."]],"note":"이 프롬프트는 설문 문항 자체를 다시 생성하는 것이 아니라, 바로 앞 단계에서 확정한 문항을 Google Forms로 구현하기 위한 두 가지 결과물을 요청합니다. 같은 AI 대화에서 확정 문항을 참조하도록 하고, 새 대화라면 확정 문항 전문을 함께 제공해야 합니다. 생성된 Apps Script는 실행 전 API와 개인정보 수집 항목을 검토하고, 최초 실행 시 권한 승인이 필요할 수 있습니다."},{"title":"STEP 2 — 가상 설문 데이터 만들기","kicker":"STEP 2","kind":"section","points":["7명의 가상 응답을 생성하여 데이터 분석을 연습합니다."],"steps":["원본 문항을 AI에 전달","가상 응답 생성","응답 유형 비율 확인"],"codes":[],"note":"가상 응답은 실제 조사 결과가 아닙니다."},{"title":"실습 2 — AI로 가상 응답 데이터 생성","kicker":"STEP 2","kind":"prompt","points":["본인 3명 · 동행 2명 · 대리 2명","이름 마스킹 · 전화번호 더미값","점수 편차와 구체적인 자유 의견"],"steps":["프롬프트 복사","AI에서 표 형태로 생성","7명·응답 유형·열 순서 검토","함수 분석은 강사가 제공한 공통 가상 데이터 7명으로 진행합니다.","공통 CSV를 다운로드하거나 복사하여 Google Sheets A1에 붙여넣습니다.","시트 이름을 설문응답으로 바꾸고 C·E·F·G·K·L·M·N열 위치를 확인합니다.","숫자 점수 열은 숫자 형식인지 확인합니다."],"codes":[["가상 데이터 생성 프롬프트","앞서 작성한 설문지 문항을 바탕으로 [ 7 ]명의 가상 응답 데이터를 생성해줘.\n결과물은 구글 스프레드시트에 바로 붙여넣거나 만들 수 있는 표 형태로 제공해줘.\n\n[데이터 생성 조건]\n1. 1열(A열): 설문 제출 날짜와 시간(타임스탬프) 입력\n2. 개인정보 서식:\n   - 이름: 가운데 글자 마스킹 처리 (예: 김*민, 이*준, 박*우)\n   - 연락처: 모두 '000-0000-0000' 형태로 통일\n3. 응답 편차: 모든 점수가 만점으로 쏠리지 않도록 만족, 보통, 어려움 등 다양한 반응을 현실적으로 분배\n4. 응답자 구분: '본인이 직접 작성'(3명), '보호자(보조강사)와 함께 작성'(2명), '대리 작성'(2명) 비율 반영\n5. 주관식 문항: 단순 단답형('좋았습니다' 등)을 피하고, 실제 수업 참여 학생의 입말이 느껴지는 구체적인 문장으로 작성"]],"note":"AI가 생성한 응답은 사람마다 다를 수 있습니다. STEP 3~4는 동일한 공통 가상 데이터 7명으로 실습하여 수식 결과와 열 위치를 일치시킵니다. 공통 데이터 다운로드 버튼을 사용하세요."},{"title":"데이터 분석 전 확인할 사항","kicker":"STEP 2","kind":"check","points":["열 순서가 수식 참조와 일치하는가?","7행의 응답 데이터가 있는가?","F·G·K·N열이 숫자인가?","L·M열 응답 문구가 수식과 정확히 같은가?"],"steps":["데이터 검증표 확인","필요한 열의 표시 형식 수정","개인정보는 가상값만 사용"],"codes":[],"note":"원본에서 L열은 5점 척도라고도 설명하지만 실제 COUNTIF는 텍스트 선택지를 사용합니다. 실습에서는 텍스트 범주로 통일합니다."},{"title":"STEP 3 — 교육 만족도 데이터 분석","kicker":"STEP 3","kind":"section","points":["원본 데이터 → 수식 → KPI → 차트 → 교육 개선 아이디어"],"steps":["분석 요약 탭 만들기","함수 결과 확인","피벗과 대시보드 구성"],"codes":[],"note":"분석은 계산과 해석을 분리하여 진행합니다."},{"title":"KPI란 무엇인가?","kicker":"STEP 3","kind":"kpi","points":["응답자 수","수업 만족도 평균","설명 이해도 평균","기기 사용 자신감 평균"],"steps":["새 시트 이름을 분석요약으로 지정","B1:B7에 원본 수식 순서대로 입력"],"codes":[["응답자 수","=COUNTA('설문응답'!C2:C8)"],["수업 만족도 평균","=AVERAGE('설문응답'!F2:F8)"],["강사 설명 이해도 평균","=AVERAGE('설문응답'!G2:G8)"],["기기 사용 자신감 평균","=AVERAGE('설문응답'!K2:K8)"]],"note":"KPI는 중요한 결과를 한눈에 보여주는 핵심 지표입니다. 표시 숫자는 가상 데이터 시연 결과입니다."},{"title":"COUNTA 함수 — 응답자 수 계산","kicker":"STEP 3","kind":"formula","points":["값이 들어 있는 셀의 개수를 셉니다.","C2:C8의 이름이 채워진 셀을 계산합니다."],"steps":["분석요약 B1 셀 선택","수식 붙여넣기","결과 7 확인"],"codes":[["총 응답자 수","=COUNTA('설문응답'!C2:C8)"]],"note":"빈칸이 있으면 실제 응답 행 수와 다를 수 있으므로 데이터 상태를 확인합니다."},{"title":"AVERAGE 함수 — 평균 만족도 계산","kicker":"STEP 3","kind":"formula","points":["F열 수업 만족도 점수의 평균","G열 설명 이해도 평균","K열 기기 사용 자신감 평균"],"steps":["분석요약 B2~B4 셀에 차례로 입력","소수점 표시 자릿수 설정","숫자 형식 확인"],"codes":[["수업 만족도","=AVERAGE('설문응답'!F2:F8)"],["설명 이해도","=AVERAGE('설문응답'!G2:G8)"],["기기 사용 자신감","=AVERAGE('설문응답'!K2:K8)"]],"note":"원본 PDF는 F열을 전반적인 수업 만족도로 설명합니다. 실습에서는 같은 열을 수업 즐거움/만족도 점수로 취급합니다."},{"title":"COUNTIF 함수 — 비율과 NPS 계산","kicker":"STEP 3","kind":"formula","points":["조건에 맞는 응답 수를 전체 응답 수로 나눕니다.","NPS = 추천자(9~10점) 비율 − 비추천자(0~6점) 비율","NPS는 백분율이 아니라 −100~100 범위의 지수입니다."],"steps":["분석요약 B5~B7에 수식 붙여넣기","B5·B6은 백분율 형식으로 표시","B7은 일반 숫자 형식으로 표시"],"codes":[["산출물 만족률","=(COUNTIF('설문응답'!L2:L8, \"아주 마음에 든다\") + COUNTIF('설문응답'!L2:L8, \"마음에 든다\")) / B1"],["재참여 희망 비율","=COUNTIF('설문응답'!M2:M8, \"꼭 다시 참여하고 싶다\") / B1"],["NPS 지수","=(COUNTIF('설문응답'!N2:N8, \">=9\") - COUNTIF('설문응답'!N2:N8, \"<=6\")) / B1 * 100"]],"note":"L열의 선택지 문구가 수식과 같아야 합니다. NPS는 백분율 서식으로 지정하면 안 됩니다."},{"title":"QUERY 함수 — 조건별 응답 찾기","kicker":"STEP 3","kind":"formula","points":["기기 자신감 K열이 3점 이하인 행을 추출합니다.","필요한 열 C·E·H·J·K만 표시합니다."],"steps":["분석요약 A10 선택","QUERY 수식 붙여넣기","조건에 맞는 학생의 행만 나타나는지 확인"],"codes":[["조건부 관심 학생","=QUERY('설문응답'!A1:P8, \"SELECT C, E, H, J, K WHERE K <= 3\", 1)"]],"note":"원본 교안의 QUERY 조건은 K <= 3 하나입니다. 학생 지원 필요 여부를 점수 하나만으로 단정하지 않도록 설명합니다."},{"title":"SPARKLINE — 셀 안에 미니 차트 만들기","kicker":"STEP 3","kind":"formula","points":["숫자를 셀 안의 작은 막대로 표현합니다.","E11의 점수를 기준으로 F11에 막대를 표시합니다."],"steps":["QUERY 결과가 A10부터 출력되는지 확인","F11에 수식 입력","필요한 행까지 아래로 채우기"],"codes":[["미니 막대 차트","=SPARKLINE(E11, {\"charttype\", \"bar\"; \"max\", 5; \"color1\", \"#EA4335\"})"]],"note":"QUERY가 5개 열을 출력하므로 E열이 점수 K에 해당합니다. F열에 미니 차트를 추가합니다."},{"title":"피벗 테이블 — 응답자 유형별 비교","kicker":"STEP 3","kind":"pivot","points":["행 · 응답자 구분","값 · 설명 이해도 평균","값 · 기기 자신감 평균"],"steps":["설문응답!A1:P8 선택","삽입 → 피벗 테이블 → 새 시트","행: 응답자 구분","값: 설명 이해도·기기 자신감, 요약 방식 평균","탭 이름 응답자별 비교"],"codes":[],"note":"7명의 소규모 가상 데이터이므로 그룹 간 차이를 일반화하지 않습니다. 원본 PDF의 4.3점/2.5점은 고정된 실습 데이터가 없는 설명용 수치입니다."},{"title":"Gemini로 분석 대시보드 만들기","kicker":"STEP 3","kind":"dashboard","points":["4개 KPI 카드 + 평균 점수 막대 차트 + 응답 유형 도넛 차트","자유 의견 요약 표를 한 화면에 구성합니다."],"steps":["공통 설문응답 시트를 엽니다.","이 슬라이드의 [Gemini 프롬프트 보기 · 복사] 버튼을 누릅니다.","프롬프트 전문을 복사하여 사용 가능한 Gemini에 입력합니다.","KPI 수치·차트 범주·자유 의견이 원본 데이터와 일치하는지 검증합니다.","Gemini 기능이 없는 계정은 Sheets에서 차트를 직접 구성합니다."],"codes":[["Gemini로 교육 만족도 분석 대시보드 만들기","너는 Google Sheets 데이터 분석 전문가이자 교육 성과 대시보드 디자이너야.\n\n현재 스프레드시트의 '설문응답' 시트에 있는 가상 응답 7명의 데이터를 분석하고, '대시보드'라는 새 시트에 교육 만족도 종합 대시보드를 구성해줘.\n\n[필수 구성]\n1. 상단 KPI 4개: 총 응답자 수(C열), 수업 즐거움 평균(F열), 설명 이해도 평균(G열), 기기 사용 자신감 평균(K열)\n2. 막대 차트: F·G·K열의 항목별 평균 점수 비교(1~5점)\n3. 도넛 차트: E열 응답자 구분별 인원과 비율\n4. 하단 피드백 표: O열 주관식 의견의 핵심 내용 요약(원문 왜곡 금지)\n5. 비즈니스 블루 톤, 높은 대비, 큰 글씨, 표 자동 줄바꿈 적용\n\n[정확성 검증]\n- 응답자 수 7명인지 확인하고 누락값을 점검해줘.\n- 수식 참조 열과 원본 헤더가 일치하는지 먼저 확인해줘.\n- 가상 데이터임을 표시하고, 없는 데이터를 추측하거나 임의의 결과를 만들지 마.\n- 직접 새 시트를 생성할 수 없는 환경이라면 실행 가능한 Google Sheets 작업 순서, 필요한 수식, 차트 설정 방법을 구체적으로 안내해줘."]],"note":"Gemini가 Google Sheets에서 시트를 직접 편집하는 기능은 계정과 환경에 따라 다릅니다. 생성 가능 여부를 먼저 확인하고, 불가능하면 제시된 절차로 직접 만듭니다."},{"title":"STEP 4 — 웹 반응형 대시보드 만들기","kicker":"STEP 4","kind":"section","points":["데이터를 한눈에!"],"steps":["데이터 파일 준비","대시보드 콘셉트 결정","HTML 생성","기능 점검"],"codes":[],"note":"모바일과 PC에서 보기 쉬운 보고서를 만드는 것이 목표입니다."},{"title":"바이브 코딩이란 무엇인가?","kicker":"STEP 4","kind":"cards","points":["자연어로 필요한 화면을 설명","AI가 코드를 생성","강사가 결과를 점검하고 수정 요청"],"steps":[],"codes":[],"note":"강사는 개발자보다 기획자·검증자의 역할을 합니다."},{"title":"대시보드 제작 4단계","kicker":"STEP 4","kind":"roadmap","points":["1 · 데이터 진단과 콘셉트 추천","2 · 레이아웃과 기능 확정","3 · 단일 HTML 생성","4 · 검색·CSV 등 기능 개선"],"steps":["전체 흐름을 확인합니다: 콘셉트 추천 → 레이아웃 확정 → HTML 생성 → 기능 개선","다음 실습 1~4 슬라이드에서 해당 프롬프트를 각각 복사해 순서대로 실행합니다."],"codes":[],"note":"이 슬라이드는 전체 제작 흐름만 안내합니다. 프롬프트는 다음 4개 실습 슬라이드에 하나씩 제공합니다."},{"title":"실습 1 — 대시보드 콘셉트 추천받기","kicker":"STEP 4","kind":"concept","points":["A · 핵심 지표 요약형","B · 취약점·원인 분석형","C · 상세 모니터링·탐색형"],"steps":["가상 데이터 파일 첨부","콘셉트 추천 프롬프트 복사","추천 이유 비교","이 단계에서 코드 생성하지 않기"],"codes":[["콘셉트 추천 프롬프트","너는 데이터 시각화 전문 컨설턴트이자 UI/UX 전문가야.\n첨부한 데이터 파일을 분석해서, 이 데이터를 가장 효과적으로 전달할 수 있는 '대시보드 기획안'을 2~3가지 서로 다른 콘셉트로 제안해줘.\n\n코드는 아직 작성하지 말고, 아래 양식에 맞춰 먼저 답변해줘:\n1. 데이터 진단: 이 데이터의 주요 특징과 분석 목적 (1~2줄 요약)\n2. 추천 대시보드 콘셉트 2~3가지:\n   - 옵션 A: [핵심 지표 요약형] (보고 대상, 추천 KPI 카드 4개, 추천 차트 2개와 이유)\n   - 옵션 B: [취약점/원인 분석형] (보고 대상, 교차 분석 차트 및 필터 구성, 기대 효과)\n   - 옵션 C: [상세 모니터링/탐색형] (보고 대상, 세부 데이터 테이블 및 다차원 시각화)\n3. 데이터의 성격상 가장 추천하는 옵션 1개와 그 이유"]],"note":"원본 교안은 2~3가지 콘셉트 추천을 요구합니다. 각 실습 슬라이드의 프롬프트 보기·복사 버튼으로 해당 단계의 프롬프트만 열 수 있습니다."},{"title":"실습 2 — 대시보드 레이아웃 확정","kicker":"STEP 4","kind":"wireframe","points":["상단 · 응답자 유형 필터","중앙 · KPI 카드와 차트","하단 · 세부 데이터 요약표"],"steps":["옵션 A 선택","레이아웃 확정 프롬프트 입력","텍스트 와이어프레임 확인"],"codes":[["레이아웃 확정 프롬프트","제안해 준 구성안 중 [옵션 A: 핵심 지표 요약형]으로 대시보드를 만들고 싶어.\n\n여기에 다음 세부 요구사항을 추가로 반영해서 화면을 구성해줘:\n- 상단 필터: 데이터 범주(예: 응답자 구분 그룹)를 선택할 수 있는 드롭다운 필터 1개 추가\n- 메인 컬러: 신뢰감을 주는 모던 블루 톤과 깔끔한 카드 스타일(그림자 효과) 적용\n- 하단: 세부 데이터를 한눈에 볼 수 있는 요약 테이블 포함\n\n이 구성으로 단일 HTML 코드를 작성할 준비가 되었다면, 최종 화면 레이아웃 와이어프레임을 텍스트로 간단히 정리해줘."]],"note":"코드를 만들기 전에 화면 구성에 대한 합의를 완료합니다. 각 실습 슬라이드의 프롬프트 보기·복사 버튼으로 해당 단계의 프롬프트만 열 수 있습니다."},{"title":"실습 3 — 단일 HTML 대시보드 생성","kicker":"STEP 4","kind":"dashboard","points":["HTML + CSS + JavaScript","필터와 차트 연동","인쇄 → PDF 저장"],"steps":["데이터 파일 첨부","코드 생성 프롬프트 입력","HTML 파일로 저장","브라우저에서 필터와 PDF 인쇄 확인"],"codes":[["HTML 생성 프롬프트","2단계에서 확정한 기획안을 바탕으로, 첨부된 파일의 실제 데이터를 모두 반영한 '웹 반응형 인터랙티브 대시보드'를 단일 HTML 파일로 작성해줘.\n\n[기술 및 디자인 필수 조건]\n1. 단일 파일 구조: <!DOCTYPE html>부터 시작하여 HTML, CSS, JS가 모두 포함된 완전한 코드로 출력.\n2. 반응형 디자인: Tailwind CSS CDN을 사용하여 PC에서는 다단 그리드, 모바일에서는 세로 1열 카드로 자동 재배치.\n3. 인터랙티브 차트: Chart.js CDN을 사용하고, 마우스 호버 시 상세 수치 툴팁 표시.\n4. 필터 연동: 상단 필터 선택 시 차트와 하단 테이블의 데이터가 즉시 연동되어 바뀌는 자바스크립트 동작 구현.\n5. 대시보드 화면 PDF 저장 기능:\n   - 대시보드 우측 상단(헤더 영역)에 'PDF로 저장' 버튼을 추가하고, 클릭 시 브라우저 인쇄(window.print())를 통해 현재 대시보드 화면이 PDF로 저장되도록 구현. (인쇄 시 저장 버튼 자체는 숨김 처리)"]],"note":"원본 프롬프트는 Tailwind와 Chart.js CDN을 요청합니다. CDN 기반 생성물은 인터넷이 필요할 수 있습니다. 현재 이 교육 교안 자체는 오프라인 독립 실행 방식입니다. 각 실습 슬라이드의 프롬프트 보기·복사 버튼으로 해당 단계의 프롬프트만 열 수 있습니다."},{"title":"실습 4 — 대시보드 기능 개선하기","kicker":"STEP 4","kind":"dashboard", function tile(s,i){let m=String(s).match(/^STEP\s*(\d+)\s*[·—-]\s*(.*)$/i);let label=m?m[2]:s;let split=label.replace(/Google Forms\s*설문/i,'Google Forms|설문지 생성').replace(/Sheets\s*가상 데이터/i,'Google Sheets|가상 데이터 생성').replace(/수식·피벗·Gemini 분석/i,'Google Sheets|데이터 분석').replace(/바이브 코딩 웹 대시보드/i,'바이브 코딩|웹 대시보드 제작');return `<div class="tile">${m?`<span class="step-num">STEP ${m[1]}</span><strong class="step-name">${split.split('|').map(esc).join('<br>')}</strong>`:`<span class="num">${String(i+1).padStart(2,'0')}</span><strong>${String(s).split("|").map(esc).join("<br>")}</strong>`}</div>`}
function flow(points){return `<div class="flow">${points.map((p,i)=>tile(p,i)).join('')}</div>`}
function dashboardSkeleton(){return `<div class="dashboard"><div class="dash-kpi"><span>응답자 수</span><strong>7명</strong></div><div class="dash-kpi"><span>수업 즐거움</span><strong>3.6 / 5</strong></div><div class="dash-kpi"><span>설명 이해도</span><strong>3.3 / 5</strong></div><div class="dash-kpi"><span>기기 자신감</span><strong>2.9 / 5</strong></div><div class="chartarea"><h4>항목별 평균 점수 · 가상 응답</h4>${bars([['즐거움',3.57],['이해도',3.29],['자신감',2.86]])}</div><div class="chartarea"><h4>응답 유형 분포 · 가상 응답</h4><div class="donut"></div><div class="donut-legend"><span><i class="dot" style="background:#2563eb"></i>본인 3</span><span><i class="dot" style="background:#14b8a6"></i>동행 2</span><span><i class="dot" style="background:#8b5cf6"></i>대리 2</span></div></div></div>`}
function bars(items){return items.map(([n,v])=>`<div class="bar"><label>${esc(n)}</label><div class="track"><div class="fill" data-width="${v/5*100}%"></div></div><em>${v.toFixed(1)}</em></div>`).join('')}
function dataTable(limit=4){return `<div class="table-wrap"><table class="mini-sheet"><thead><tr>${['C 이름','E 응답 유형','F 즐거움','G 이해도','K 자신감','N NPS'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,limit).map(r=>`<tr>${[r[2],r[4],r[5],r[6],r[10],r[13]].map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function svgHero(){return `<svg viewBox="0 0 360 240" fill="none" aria-label="설문 데이터에서 차트로 연결되는 도식"><rect x="10" y="24" width="105" height="184" rx="16" fill="white" stroke="#bfd5f7" stroke-width="2"/><rect x="28" y="44" width="69" height="13" rx="6" fill="#2563eb"/><path d="M29 85H95M29 111H95M29 137H95M29 163H95" stroke="#9bb7df" stroke-width="9" stroke-linecap="round"/><path d="M124 116H181" stroke="#7e9cc7" stroke-width="4" stroke-dasharray="7 6"/><path d="M174 107L187 116L174 125" stroke="#7e9cc7" stroke-width="4"/><rect x="198" y="24" width="150" height="184" rx="16" fill="white" stroke="#bfd5f7" stroke-width="2"/><path d="M216 63H330M216 90H330M216 117H330M216 144H330M216 171H330" stroke="#e2e8f0" stroke-width="2"/><rect x="227" y="122" width="19" height="48" rx="5" fill="#14b8a6"/><rect x="262" y="98" width="19" height="72" rx="5" fill="#2563eb"/><rect x="297" y="72" width="19" height="98" rx="5" fill="#8b5cf6"/></svg>`}
function wire(){return `<div class="wire"><div class="wire-block" style="height:36px">응답자 유형 필터 ▾</div><div class="wire-row">${['KPI 1','KPI 2','KPI 3','KPI 4'].map(x=>`<div class="wire-block">${x}</div>`).join('')}</div><div class="wire-row" style="grid-template-columns:1fr 1fr"><div class="wire-block wire-chart">막대 차트</div><div class="wire-block wire-chart">도넛 차트</div></div><div class="wire-block" style="height:42px">상세 데이터 표</div></div>`}
function draw(s,i){let p=s.points;if(i===9)return `<div class="data-create-visual"><div class="data-create-steps"><div class="data-create-step"><span>01 · 요청</span><strong>AI에 프롬프트 입력</strong><p>확정한 설문 문항을 기준으로 응답 생성을 요청합니다.</p></div><div class="data-create-arrow">→</div><div class="data-create-step"><span>02 · 생성</span><strong>가상 응답 7명 생성</strong><p>본인 3명 · 도움 2명 · 대리 2명</p></div><div class="data-create-arrow">→</div><div class="data-create-step"><span>03 · 검토</span><strong>데이터 구조 확인</strong><p>열 제목 · 점수 형식 · 응답 유형을 점검합니다.</p></div></div><div class="data-create-bottom"><div><strong>실습 2 · 가상 데이터 생성 프롬프트</strong><p>프롬프트 전문은 실습 모드에서 확인하고 복사하세요.</p></div><button type="button" class="action primary" data-show-codes="1">프롬프트 보기 · 복사</button></div></div>`;if(i===7)return `<div class="form-methods"><div class="method-card"><div class="method-badge">STEP 01 · 문항 확정</div><h3>설문 문항을 먼저 확정</h3><p>질문 번호 · 섹션 · 질문 유형 · 선택지를 검토합니다.</p><div class="method-steps">확정 문항 → AI에 구현 요청</div></div><div class="method-card"><div class="method-badge">STEP 02 · 두 결과물 생성</div><h3>하나의 프롬프트로 2가지 생성</h3><p>① Google Forms 내장 AI용 프롬프트<br>② Google Apps Script 자동 생성 코드</p><div class="method-steps">생성된 결과물 검토 → Forms에서 실행</div><button type="button" class="action primary" data-show-codes="1">요청 프롬프트 보기 · 복사</button></div></div>`;switch(s.kind){case 'hero':return `<div class="hero-art"><div class="hero-text">${esc(p[0])}<p style="font-size:17px;color:#64748b;font-weight:500">${esc(p[1])}</p></div><div class="hero-icon">${svgHero()}</div></div>`;case 'section':{let names={'STEP 1':['Google Forms','설문지 생성'],'STEP 2':['Google Sheets','가상 데이터 생성'],'STEP 3':['Google Sheets','데이터 분석'],'STEP 4':['바이브 코딩','웹 대시보드 제작']};let x=names[s.kicker]||['데이터 활용','실습'];return `<div class="hero-art"><div class="hero-text" style="color:var(--accent)"><span class="step-num">${esc(s.kicker)}</span>${esc(x[0])}<br>${esc(x[1])}<p style="font-size:17px;color:#64748b;font-weight:500">${esc(p[0])}</p></div><div class="hero-icon">${svgHero()}</div></div>`}case 'roadmap':case 'flow':return flow(p);case 'case':case 'survey':case 'cards':case 'concept':return `<div class="cards">${p.map(tile).join('')}</div>`;case 'sheet':return dataTable(4);case 'check':case 'form':case 'pivot':return `<div class="cards">${p.map(tile).join('')}</div>`;case 'kpi':return `<div class="slide-kpi-intro"><div class="kpi-definition"><strong>KPI(핵심 성과 지표)</strong>는 교육 목표가 얼마나 달성되었는지 보여주는 중요한 숫자입니다.</div>${dashboardSkeleton()}</div>`;case 'formula':{let f=s.codes?.[0]?.[1]||'';return `<div class="formula-demo"><div class="formula-box"><div class="formula-tools"><span class="pill">Google Sheets</span><button class="copy" data-copy-formula="0" type="button">수식 복사 ⧉</button></div><p style="font-weight:800;font-size:19px">${esc(s.codes?.[0]?.[0]||'수식')}</p><div class="formula-line" tabindex="0" aria-label="수식 한 줄 보기, 가로 스크롤 가능"><code>${esc(f)}</code></div>${s.codes.length>1?`<button class="action" data-show-codes="1" type="button">다른 수식 ${s.codes.length-1}개 보기</button>`:''}</div><div class="result"><small>실습 수식 · 결과 확인</small><strong>${i===13?'7':i===14?'3.6':i===15?'NPS':i===16?'K ≤ 3':'▰▰▰'}</strong><small>설명용 가상 데이터</small></div></div>`}case 'dashboard':return dashboardSkeleton();case 'wireframe':return wire();case 'prompt':return `<div class="hero-art"><div class="hero-text">AI 프롬프트로 시작하세요.<p style="font-size:17px;color:#64748b;font-weight:500">아래 버튼으로 전문을 확인하고 복사할 수 있습니다.</p><div class="inline-practice"><button class="action primary" data-show-codes="1" type="button">프롬프트 열기 · 복사하기</button></div></div><div class="hero-icon">${svgHero()}</div></div>`;default:return `<div class="cards">${p.map(tile).join('')}</div>`}}
function renderNav(){ $('nav').innerHTML=slides.map((s,i)=>`<button class="navitem ${i===index?'active':''}" data-idx="${i}" title="${esc(s.title)}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(s.title)}</span></button>`).join('');document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>goto(+b.dataset.idx));document.querySelector('.navitem.active')?.scrollIntoView({block:'nearest'});}
function render(){let s=slides[index];$('stage').style.setProperty('--accent',accent(s.kicker));$('kicker').textContent=s.kicker;$('stageNo').textContent=`${String(index+1).padStart(2,'0')} / ${slides.length}`;$('slideTitle').innerHTML=index===0?'Google Workspace와<br>생성형 AI를 활용한 데이터 수집·분석·시각화':esc(s.title);let brief={7:'확정 문항으로 Forms 생성용 프롬프트와 자동화 코드를 요청합니다.',20:'데이터를 한눈에!',21:'AI에게 원하는 화면을 설명합니다.',24:'데이터를 보기 좋은 화면으로 설계합니다.',25:'설계한 화면을 HTML로 완성합니다.',26:'검색·필터·다운로드 기능을 더합니다.'};$('subtitle').textContent=brief[index]||((s.kind==='hero')?'실습 중심 디지털 역량 강화 워크숍':(s.kind==='kpi'?'교육 성과를 확인하는 중요한 숫자':s.points[0]));if(s.kind==='section')$('subtitle').textContent='실습의 핵심 과정을 한눈에 확인합니다.';if(s.kicker==='WRAP')$('subtitle').textContent='설문지 생성부터 웹 대시보드까지';const step4=index>=23&&index<=26;const promptBar=step4?'<div class="step4-prompt-toolbar"><span>실습 '+(index-22)+' · AI 프롬프트</span><button type="button" class="action primary" data-show-codes="1">프롬프트 보기 · 복사</button></div>':'';const mainVisual=s.title.startsWith('Gemini로 분석')?'<div class="gemini-layout"><div class="gemini-toolbar"><span>Gemini 분석 프롬프트</span><button type="button" class="action primary" data-show-codes="1">프롬프트 보기 · 복사</button></div>'+draw(s,index)+'</div>':draw(s,index);$('visual').innerHTML=step4?'<div class="step4-layout step4-layout-'+(index-22)+'">'+(index>=25?promptBar:'')+'<div class="step4-art">'+mainVisual+'</div>'+(index<=24?promptBar:'')+'</div>':mainVisual;$('visual').classList.remove('fadein');void $('visual').offsetWidth;$('visual').classList.add('fadein');$('counter').textContent=`${index+1} / ${slides.length}`;$('progress').style.width=`${(index+1)/slides.length*100}%`;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;renderNav();renderPractice();if($('sharedCsv'))$('sharedCsv').onclick=()=>{filtered=rows.slice();downloadCSV()};$('visual').querySelectorAll('[data-copy-formula]').forEach(b=>b.onclick=()=>copyText(s.codes[+b.dataset.copyFormula][1].replace(/\s*\n\s*/g,' ')));$('visual').querySelectorAll('[data-show-codes]').forEach(b=>b.onclick=()=>{setMode('practice');$('codeCards').scrollIntoView({block:'start',behavior:'smooth'})});requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(e=>e.style.width=e.dataset.width));}
function safeGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}function safeSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function renderPractice(){let s=slides[index];$('practiceTitle').textContent=s.title;$('practice').classList.toggle('empty-practice',!s.steps.length&&!s.codes.length);$('tasks').innerHTML=(s.steps.length?s.steps:[]).map((x,i)=>`<label class="task"><input type="checkbox" data-check="${index}-${i}" ${safeGet('done-'+index+'-'+i)==='1'?'checked':''}><span>${esc(x)}</span></label>`).join('');document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>safeSet('done-'+c.dataset.check,c.checked?'1':'0'));$('codeCards').innerHTML=(index===9?'<div class="practice-dataset"><div><strong>선택 실습 · 공통 가상 데이터</strong><p>STEP 3의 함수 분석을 동일한 데이터로 진행할 때 사용합니다. AI로 생성한 데이터와 비교해 보세요.</p></div><button type="button" class="action primary" id="sharedCsv">공통 CSV 다운로드</button></div>':'')+(s.codes||[]).map(([name,code],i)=>`<div class="codecard"><div class="codehead"><strong>${esc(name)}</strong><button class="copy" data-code="${i}">원문 복사</button></div><div class="codebody ${String(code).trim().startsWith('=')?'formula-code':''}"><code>${esc(code)}</code></div></div>`).join('');document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>copyText(s.codes[+b.dataset.code][1].trim().startsWith('=')?s.codes[+b.dataset.code][1].replace(/\s*\n\s*/g,' '):s.codes[+b.dataset.code][1]));$('teacherNote').textContent=s.note?'강사 안내 · '+s.note:'';$('teacherNote').style.display=s.note?'':'none';$('demo').innerHTML=[12,13,14,15,16,17,18,19,25,26].includes(index)?makeDemo(index):'';bindDemo();}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('복사했습니다. Google Sheets 또는 AI에 붙여넣으세요.')}catch(e){let ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();toast(ok?'복사했습니다.':'브라우저 복사가 제한되었습니다. 텍스트를 직접 선택해 복사하세요.')}}

function makeDemo(i){if(i===16)return `<div class="demo-panel"><h3>QUERY 조건 확인 · K열 3점 이하</h3>${dataTableFiltered(rows.filter(r=>r[10]<=3))}</div>`;if(i===17)return `<div class="demo-panel"><h3>SPARKLINE 원리 · 5점 만점</h3>${rows.map(r=>`<div class="bar"><label>${esc(r[2])}</label><div class="track"><div class="fill" data-width="${r[10]*20}%"></div></div><em>${r[10]}</em></div>`).join('')}</div>`;if(i===18)return `<div class="demo-panel"><h3>응답자 유형별 평균 · 가상 데이터</h3>${pivotTable()}</div>`;if(i===19||i===25||i===26)return `<div class="demo-panel"><h3>필터·검색·차트 연동 체험 <span style="font-size:12px;color:#64748b">(가상 응답 7명)</span></h3><div class="filterrow"><select id="typeFilter" aria-label="응답자 유형"><option value="all">전체 응답</option><option value="본인이 직접 작성">본인 직접 작성</option><option value="보호자(보조강사)와 함께 작성">동행 작성</option><option value="대리 작성">대리 작성</option></select><input id="searchInput" placeholder="이름·활동·의견 검색" aria-label="키워드 검색"><button class="action" id="csvBtn">CSV 다운로드</button><button class="action" id="printBtn">PDF 인쇄</button></div><div id="dashContent"></div></div>`;return `<div class="demo-panel"><h3>원본 데이터 열 참조 확인</h3>${dataTable(7)}<p class="note">C: 이름 · E: 응답자 유형 · F: 즐거움 · G: 이해도 · K: 자신감 · L: 산출물 만족 · M: 재참여 · N: 추천 의향</p></div>`}
function dataTableFiltered(data){return `<div class="table-wrap"><table class="mini-sheet"><thead><tr>${['이름','응답자 유형','즐거움','이해도','자신감','NPS'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${[r[2],r[4],r[5],r[6],r[10],r[13]].map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="6">해당 응답이 없습니다.</td></tr>'}</tbody></table></div>`}
function pivotTable(){let types=[...new Set(rows.map(r=>r[4]))];return `<div class="table-wrap"><table class="mini-sheet"><thead><tr><th>응답 유형</th><th>인원</th><th>설명 이해도 평균</th><th>기기 자신감 평균</th></tr></thead><tbody>${types.map(t=>{let r=rows.filter(x=>x[4]===t);return `<tr><td>${esc(t)}</td><td>${r.length}</td><td>${avg(r,6).toFixed(2)}</td><td>${avg(r,10).toFixed(2)}</td></tr>`}).join('')}</tbody></table></div>`}
function avg(a,k){return a.length?a.reduce((x,r)=>x+Number(r[k]),0)/a.length:0}
function bindDemo(){if(!$('typeFilter'))return;$('typeFilter').onchange=updateDash;$('searchInput').oninput=updateDash;$('csvBtn').onclick=downloadCSV;$('printBtn').onclick=()=>window.print();updateDash()}
function updateDash(){let type=$('typeFilter').value,q=$('searchInput').value.trim().toLowerCase();filtered=rows.filter(r=>(type==='all'||r[4]===type)&&(!q||[r[2],r[4],r[8],r[9],r[14]].some(x=>String(x).toLowerCase().includes(q))));let n=filtered.length,posit=filtered.filter(r=>r[13]>=9).length,neg=filtered.filter(r=>r[13]<=6).length,nps=n?(posit-neg)/n*100:0;let vals=[['즐거움',avg(filtered,5)],['이해도',avg(filtered,6)],['자신감',avg(filtered,10)]];let types=['본인이 직접 작성','보호자(보조강사)와 함께 작성','대리 작성'],counts=types.map(t=>filtered.filter(r=>r[4]===t).length);let colors=['#2563eb','#14b8a6','#8b5cf6'],cum=0;let gradient=counts.map((v,i)=>{let start=cum;cum+=n?v/n*100:0;return `${colors[i]} ${start}% ${cum}%`}).join(',');$('dashContent').innerHTML=`<div class="stats"><div class="stat"><span>응답자 수</span><strong>${n}명</strong></div><div class="stat"><span>즐거움 평균</span><strong>${n?avg(filtered,5).toFixed(2):'—'}</strong></div><div class="stat"><span>자신감 평균</span><strong>${n?avg(filtered,10).toFixed(2):'—'}</strong></div><div class="stat"><span>NPS 지수</span><strong>${n?nps.toFixed(1):'—'}</strong></div></div><div class="chartdemo"><div class="chartbox"><h4>항목별 평균 점수 / 5점</h4>${bars(vals)}</div><div class="chartbox"><h4>응답 유형 분포</h4><div class="donut" style="background:${n?'conic-gradient('+gradient+')':'#e2e8f0'}"></div><div class="donut-legend">${types.map((t,i)=>`<span><i class="dot" style="background:${colors[i]}"></i>${['본인','동행','대리'][i]} ${counts[i]}</span>`).join('')}</div></div></div>${dataTableFiltered(filtered)}<p class="note">이 결과는 교안에서 제공하는 설명용 가상 데이터로 계산했습니다. 실제 조사 결과가 아닙니다.</p>`;requestAnimationFrame(()=>document.querySelectorAll('#dashContent .fill').forEach(e=>e.style.width=e.dataset.width));}
function downloadCSV(){let all=[headers.slice(0,15),...filtered];let csv='\ufeff'+all.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.href=url;a.download='가상_설문응답_필터결과.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function goto(i){index=Math.max(0,Math.min(slides.length-1,i));render();if(window.innerWidth<950)$('sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}
function setMode(m){mode=m;$('lectureBtn').classList.toggle('active',m==='lecture');$('practiceBtn').classList.toggle('active',m==='practice');$('practice').classList.toggle('show',m==='practice');if(m==='practice')setTimeout(()=>$('practice').scrollIntoView({block:'nearest',behavior:'smooth'}),60)}
$('prev').onclick=()=>goto(index-1);$('next').onclick=()=>goto(index+1);$('lectureBtn').onclick=()=>setMode('lecture');$('practiceBtn').onclick=()=>setMode('practice');$('focusBtn').onclick=()=>{document.body.classList.toggle('focus');$('focusBtn').textContent=document.body.classList.contains('focus')?'⊞ 일반':'⛶ 발표'};$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goto(index+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goto(index-1)}else if(e.key==='Escape'&&document.body.classList.contains('focus')){$('focusBtn').click()}});
$('stage').addEventListener('wheel',e=>{if(mode==='practice'||e.target.closest('.formula-line,.table-wrap,.wire,.codebody')||Math.abs(e.deltaY)<12)return;e.preventDefault();if(wheelLock)return;wheelLock=true;goto(index+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,650)},{passive:false});
render();
</script></body></html>
